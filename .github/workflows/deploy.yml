# Deploy on merge to main.
#
# The step order is the point, and it is the inverse of the obvious one. Migrations
# run before the Worker is uploaded, and a failed migration stops the deploy
# before the code is touched. Deploying first would mean a Worker that reads
# `users.expiry_date` serving traffic against a database that does not have it -
# and `membership()` reads that column on every authenticated request, so the
# result is not a degraded feature, it is every signed-in request failing.
#
# What is deliberately not here: `d1 execute --file`. It is not idempotent, so a
# migration that has already run fails when it runs again, which made every
# manual apply need a probe first to find out what had been applied.
# `d1 migrations apply` records what it ran in d1_migrations and skips those.
#
# One-time setup, before this workflow will work:
#
#   1. Create an API token (Cloudflare dashboard > My Profile > API Tokens) with
#      "Workers Scripts: Edit" and "Account: D1: Edit". A template token with
#      those two permissions is enough; it does not need Zone permissions.
#   2. Add it as the repository secret CLOUDFLARE_API_TOKEN.
#   3. Add the account id as the repository secret CLOUDFLARE_ACCOUNT_ID
#      (Cloudflare dashboard > Workers & Pages > Overview, or the dashboard URL).
#   4. Add the D1 database id as D1_ID and its name as D1_NAME. A wrong value here
#      is the one mistake that is not obvious: migrations would apply to a
#      database nobody reads, and the deploy would still succeed.
#   5. Nothing to seed by hand. `scripts/deploy.sh` reconciles d1_migrations
#      against the database before `migrations apply` reads it, so a database
#      that was migrated by hand - which has a complete schema and an empty
#      ledger - repairs itself instead of failing every deploy on
#      `table "attempts" already exists`.
#   6. Add the *deployed Worker's own name* as the repository secret
#      WORKER_NAME. This is the one that fails silently. The build names the
#      Worker after package.json ("minewords-blue-book"), but a Worker created
#      through Cloudflare's Git integration is named after the repository
#      ("eleven-plus-vocabulary-website"). Without this the deploy uploads a
#      second Worker, the live one stays on the last commit, and every step
#      reports success. The target is printed as "target Worker:" before
#      anything is applied, so read it in the log if you are unsure.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. Two concurrent runs would both try to apply the same
# pending migration, and the second would fail on a column the first had added.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Verifies, and fails the deploy rather than the build. The suite includes
      # the check that every migration on disk is in the drizzle journal, which
      # is the failure that let four migrations go unapplied with no warning
      # anywhere.
      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run check:deploy

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_ID }}
          D1_NAME: ${{ secrets.D1_NAME }}
          # Which Worker to upload to. Required: the generated config names it
          # after package.json, which is not the Worker this repository serves.
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
        run: scripts/deploy.sh --skip-verify
