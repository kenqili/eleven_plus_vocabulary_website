<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b4a7a"/>
      <stop offset="0.55" stop-color="#224f82"/>
      <stop offset="1" stop-color="#16304f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5fa"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Depth drawn rather than filtered: feDropShadow is dropped by librsvg, and an
       SVG that only renders in a browser is not much of a source file. -->
  <rect x="112" y="168" width="776" height="730" rx="34" fill="#0b1b2e" opacity="0.28"/>
  <rect x="112" y="148" width="776" height="730" rx="34" fill="url(#card)"/>
  <rect x="112" y="148" width="776" height="12" rx="6" fill="#e0a63d"/>

  <!-- Card header: who it is for. -->
  <rect x="172" y="222" width="180" height="62" rx="31" fill="#eef4ff"/>
  <text x="262" y="265" text-anchor="middle" font-size="38" font-weight="700" fill="#224f82" letter-spacing="0.5">11+</text>
  <text x="374" y="264" font-size="27" font-weight="600" fill="#5c6c84" letter-spacing="3.4">VOCABULARY</text>

  <line x1="172" y1="330" x2="828" y2="330" stroke="#e2e8f2" stroke-width="3"/>

  <!-- The word. The only thing that has to survive being shrunk to a thumbnail. -->
  <text x="172" y="444" font-size="88" font-weight="700" fill="#14213d" letter-spacing="-1">ABANDON</text>
  <rect x="172" y="474" width="104" height="7" rx="3.5" fill="#e0a63d"/>

  <text x="172" y="554" font-size="33" font-weight="500" fill="#2a3d59">to leave someone or something behind</text>
  <text x="172" y="600" font-size="33" font-weight="500" fill="#2a3d59">completely</text>

  <!-- An example, because that is what a child actually meets. -->
  <rect x="172" y="646" width="656" height="106" rx="14" fill="#e9eef7"/>
  <rect x="172" y="646" width="6" height="106" rx="3" fill="#2a3d59"/>
  <text x="204" y="692" font-size="24" fill="#46597a" font-style="italic">The sailors had to abandon</text>
  <text x="204" y="728" font-size="24" fill="#46597a" font-style="italic">the damaged ship.</text>

  <!-- Progress: the part a parent is buying, so it is inside the card where it can
       be read rather than sitting on the background in grey. -->
  <text x="172" y="820" font-size="21" font-weight="600" fill="#5c6c84" letter-spacing="1.5">WORDS MASTERED</text>
  <rect x="424" y="804" width="300" height="16" rx="8" fill="#dde4ef"/>
  <rect x="424" y="804" width="213" height="16" rx="8" fill="#2a3d59"/>
  <text x="828" y="821" text-anchor="end" font-size="27" font-weight="700" fill="#14213d">71%</text>

  <text x="500" y="952" text-anchor="middle" font-size="27" font-weight="600" fill="#ffffff" opacity="0.92" letter-spacing="1.2">MineWords</text>
</svg>
